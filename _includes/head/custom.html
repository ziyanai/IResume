{% include base_path %}

<!-- start custom head snippets -->

<!-- Support for Academicons -->
<link rel="stylesheet" href="{{ base_path }}/assets/css/academicons.css"/>

<!-- favicon from https://commons.wikimedia.org/wiki/File:OOjs_UI_icon_academic-progressive.svg -->
<link rel="apple-touch-icon" sizes="180x180" href="{{ base_path }}/images/apple-touch-icon-180x180.png"/>
<link rel="icon" type="image/svg+xml" href="{{ base_path }}/images/faviconicon.svg"/>
<link rel="icon" type="image/png" href="{{ base_path }}/images/favicon-32x32.png" sizes="32x32"/>
<link rel="icon" type="image/png" href="{{ base_path }}/images/favicon-192x192.png" sizes="192x192"/>
<link rel="manifest" href="{{ base_path }}/images/manifest.json"/>
<link rel="icon" href="/images/favicon.ico"/>
<meta name="theme-color" content="#ffffff"/>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600&family=Patrick+Hand&family=Shadows+Into+Light&display=swap" rel="stylesheet">

<style>
  .author__bio {
    color: #1d44eb;
    font-family: "Shadows Into Light", cursive;   /* 手写风格，随性有个性 */
    font-size: 1.25em;                /* 手写字体建议稍大一点 */
    font-weight: 600;
    line-height: 1.4;
  }
</style>

<style>
  /* 只在白天模式把定位图标改成橙色 */
  html:not([data-theme="dark"]) .fa-location-dot {
    color: #F97316;   /* 橙色，可按喜好调整 */
  }
</style>

<style>
  /* Publications 论文标题链接：去掉下划线 */
  .archive__item-title a {
    text-decoration: none;
    color: #0EA5E9;
    transition: color 0.2s ease;
  }

  .archive__item-title a:hover {
    text-decoration: none;
    color: #0284C7;   /* 悬停只改变颜色，不加下划线 */
  }
</style>

<!-- end custom head snippets -->
